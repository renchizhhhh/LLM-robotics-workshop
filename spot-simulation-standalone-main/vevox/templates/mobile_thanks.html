<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }
        
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(124,58,237,0.12);
            padding: 50px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 2px solid #7c3aed;
        }
        
        h1 {
            color: #111827;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .thank-you-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        
        p {
            color: #374151;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .close-message {
            margin-top: 30px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            color: #1f2937;
            font-weight: 500;
            border: 2px solid #7c3aed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="thank-you-icon">🎉</div>
        <h1>Thank You!</h1>
        <p>Your responses have been saved successfully.</p>
        <p>We appreciate your participation!</p>
        <div class="close-message">
            You can close this window now.
        </div>
    </div>
</body>
</html>
